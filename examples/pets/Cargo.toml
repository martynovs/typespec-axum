[package]
name = "pets-example"
version = "0.0.0"
edition = "2024"
publish = false

# Not a member of any workspace: the example builds on its own, as a project using the emitter would.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
form_urlencoded = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", default-features = false }
utoipa = "6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
