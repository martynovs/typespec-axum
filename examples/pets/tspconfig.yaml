# `../..` is the emitter in this checkout; a project that installed it writes `typespec-axum`.
emit:
  - "../.."
  - "@typespec/openapi3"
output-dir: "{project-root}/generated"
options:
  "typespec-axum":
    emitter-output-dir: "{output-dir}/rust"
  "@typespec/openapi3":
    emitter-output-dir: "{output-dir}/openapi"
    output-file: "openapi.json"
    openapi-versions:
      - 3.2.0
