# The inside API: types, the client and the irpc protocol; no axum. The shared models are the ones `common` wrote.
emit:
  - "../../.."
output-dir: "{project-root}/../generated"
options:
  "@martynovs/typespec-rust-api":
    emitter-output-dir: "{output-dir}/rpc"
    server: false
    client: true
    irpc: true
    client-path: crate::rpc::client
    types-path: crate::rpc::types
    type-map:
      Item: crate::common::types::Item
      NewItem: crate::common::types::NewItem
