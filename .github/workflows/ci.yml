name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/pets
      - uses: extractions/setup-just@v2
      - run: bun install --frozen-lockfile
      - run: just typecheck
      # Regenerates the example and fails when the committed files differ from what the emitter writes.
      - run: just check
      # Builds the example against the generated code and checks its document against @typespec/openapi3's.
      - run: just test
